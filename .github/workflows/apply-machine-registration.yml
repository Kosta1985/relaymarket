name: Apply machine-native registration

on:
  push:
    branches:
      - feat/machine-native-registration
    paths:
      - .github/workflows/apply-machine-registration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/machine-native-registration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch protocol surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Discovery metadata: advertise registration through both A2A skills and MCP tools/list.
          replace_once(
              'src/discovery.js',
              "    skills: [\n      {\n        id: 'discover_agents',",
              "    skills: [\n      {\n        id: 'register_agent',\n        name: 'Register agent',\n        description: 'Register a real agent and receive its API credential in the registration response. Registration is not verification or endorsement.',\n        tags: ['agent-marketplace', 'registration', 'onboarding']\n      },\n      {\n        id: 'discover_agents',"
          )

          registration_tool = """    {
              name: 'relaymarket_register_agent',
              description: 'Register a real agent on RelayMarket. Requires an Idempotency-Key HTTP header. The API key is returned only through the registration response; registration is not verification or endorsement.',
              inputSchema: {
                type: 'object',
                required: ['name', 'capabilities', 'protocols'],
                properties: {
                  id: { type: 'string', minLength: 3, maxLength: 200 },
                  name: { type: 'string', minLength: 1, maxLength: 120 },
                  description: { type: 'string', maxLength: 1000 },
                  capabilities: { type: 'array', minItems: 1, maxItems: 50, items: { type: 'string', minLength: 1, maxLength: 100 } },
                  protocols: { type: 'array', minItems: 1, maxItems: 4, items: { type: 'string', enum: ['mcp', 'a2a', 'openapi', 'http'] } },
                  endpoints: {
                    type: 'array', maxItems: 10,
                    items: {
                      type: 'object', required: ['protocol', 'url'],
                      properties: {
                        protocol: { type: 'string', enum: ['mcp', 'a2a', 'openapi', 'http'] },
                        url: { type: 'string', format: 'uri', pattern: '^https://' }
                      }
                    }
                  },
                  pricing: {
                    type: 'object',
                    properties: {
                      mode: { type: 'string', enum: ['free', 'fixed', 'quote'] },
                      amount: { type: 'number', minimum: 0 },
                      currency: { type: 'string', minLength: 3, maxLength: 8 }
                    }
                  }
                }
              }
            },
          """
          replace_once(
              'src/discovery.js',
              "export function mcpTools() {\n  return [\n    {\n      name: 'relaymarket_discover_agents',",
              "export function mcpTools() {\n  return [\n" + registration_tool + "    {\n      name: 'relaymarket_discover_agents',"
          )

          # Production Worker MCP registration.
          replace_once(
              'cloudflare/src/index.js',
              "      let value;\n      if (name === 'relaymarket_discover_agents') value = { agents: await repo.listAgents({ capability: args.capability, protocol: args.protocol, available: args.available === false ? undefined : 'true' }) };",
              "      let value;\n      if (name === 'relaymarket_register_agent') {\n        requireRegistrationIdempotencyKey(request);\n        validateRegistrationInput(args);\n        value = await protocolMutation(repo, request, 'register_agent', args, async () => registrationPayload(await repo.registerAgent(args, { source })));\n      } else if (name === 'relaymarket_discover_agents') value = { agents: await repo.listAgents({ capability: args.capability, protocol: args.protocol, available: args.available === false ? undefined : 'true' }) };"
          )

          # Production Worker A2A registration.
          replace_once(
              'cloudflare/src/index.js',
              "    let result;\n    if (data.action === 'discover_agents') result = { agents: await repo.listAgents(data.filters || {}) };",
              "    let result;\n    if (data.action === 'register_agent') {\n      const agent = data.agent || {};\n      requireRegistrationIdempotencyKey(request);\n      validateRegistrationInput(agent);\n      result = await protocolMutation(repo, request, 'register_agent', agent, async () => registrationPayload(await repo.registerAgent(agent, { source })), 'a2a');\n    } else if (data.action === 'discover_agents') result = { agents: await repo.listAgents(data.filters || {}) };"
          )
          replace_once(
              'cloudflare/src/index.js',
              "    } else result = { help: 'Use data.action: discover_agents, trust_summary, publish_task, task_matches, get_task, task_messages, accept_task, start_task, deliver_task, complete_task, dispute_task, cancel_task, send_message, get_protection_case, add_protection_evidence, payment_quote, or create_payment.' };",
              "    } else result = { help: 'Use data.action: register_agent, discover_agents, trust_summary, publish_task, task_matches, get_task, task_messages, accept_task, start_task, deliver_task, complete_task, dispute_task, cancel_task, send_message, get_protection_case, add_protection_evidence, payment_quote, or create_payment.' };"
          )

          worker_helpers = """
          function requireRegistrationIdempotencyKey(request) {
            const key = request.headers.get('idempotency-key')?.trim() || '';
            if (!key) throw problem('registration_idempotency_key_required', 400);
            if (key.length < 8 || key.length > 200) throw problem('invalid_idempotency_key', 400);
            return key;
          }

          function validateRegistrationInput(input = {}) {
            if (!String(input.name || '').trim()) throw problem('agent_name_required', 400);
            if (!Array.isArray(input.capabilities) || !input.capabilities.some(value => String(value || '').trim())) throw problem('agent_capabilities_required', 400);
            const allowed = new Set(['mcp', 'a2a', 'openapi', 'http']);
            if (!Array.isArray(input.protocols) || !input.protocols.length || input.protocols.some(value => !allowed.has(String(value || '').toLowerCase()))) throw problem('agent_protocols_invalid', 400);
            if (input.endpoints != null && !Array.isArray(input.endpoints)) throw problem('agent_endpoints_invalid', 400);
            for (const endpoint of input.endpoints || []) {
              if (!allowed.has(String(endpoint?.protocol || '').toLowerCase())) throw problem('agent_endpoint_protocol_invalid', 400);
              let url;
              try { url = new URL(String(endpoint?.url || '')); } catch { throw problem('agent_endpoint_url_invalid', 400); }
              if (url.protocol !== 'https:') throw problem('agent_endpoint_must_use_https', 400);
            }
          }

          function registrationPayload(registered) {
            return {
              agent: registered.agent,
              credential: {
                apiKey: registered.credential.apiKey,
                credentialId: registered.credential.credentialId,
                warning: 'Store this API key securely. It is available only through the registration response and idempotent replay; it cannot be retrieved later.'
              },
              trust: {
                registrationIsVerification: false,
                nextStep: 'Prove endpoint control separately if you operate a public endpoint.'
              }
            };
          }

          """
          replace_once(
              'cloudflare/src/index.js',
              "async function requireTrustAdmin(request, env) {",
              worker_helpers + "async function requireTrustAdmin(request, env) {"
          )

          # Local Node protocol parity.
          replace_once(
              'src/protocols.js',
              "import { createTask, getTask, listAgents, matches, listMessages, createMessage, acceptTask, startTask, deliverTask, completeTask, disputeTask, cancelTask, stats, authenticateApiKey, getIdempotent, saveIdempotent, createPayment } from './store.js';",
              "import { createAgent, issueCredential, createTask, getTask, listAgents, matches, listMessages, createMessage, acceptTask, startTask, deliverTask, completeTask, disputeTask, cancelTask, stats, authenticateApiKey, getIdempotent, saveIdempotent, createPayment } from './store.js';"
          )
          replace_once(
              'src/protocols.js',
              "  let value;\n  if (name === 'relaymarket_discover_agents') value = { agents: listAgents({ capability: args.capability, protocol: args.protocol, available: args.available === false ? undefined : 'true' }) };",
              "  let value;\n  if (name === 'relaymarket_register_agent') {\n    requireRegistrationIdempotencyKey(request);\n    validateRegistrationInput(args);\n    value = await protocolMutationLocal(request, 'register_agent', args, async () => registrationPayload(await registerLocalAgent(args, ctx.source)));\n  } else if (name === 'relaymarket_discover_agents') value = { agents: listAgents({ capability: args.capability, protocol: args.protocol, available: args.available === false ? undefined : 'true' }) };"
          )
          replace_once(
              'src/protocols.js',
              "    let result;\n    if (data.action === 'discover_agents') result = { agents: listAgents(data.filters || {}) };",
              "    let result;\n    if (data.action === 'register_agent') {\n      const agent = data.agent || {};\n      requireRegistrationIdempotencyKey(request);\n      validateRegistrationInput(agent);\n      result = await protocolMutationLocal(request, 'register_agent', agent, async () => registrationPayload(await registerLocalAgent(agent, ctx.source)), 'a2a');\n    } else if (data.action === 'discover_agents') result = { agents: listAgents(data.filters || {}) };"
          )
          replace_once(
              'src/protocols.js',
              "    } else result = { help: 'Use data.action: discover_agents, publish_task, task_matches, get_task, task_messages, accept_task, start_task, deliver_task, complete_task, dispute_task, cancel_task, send_message, payment_quote, or create_payment.', receivedText: text };",
              "    } else result = { help: 'Use data.action: register_agent, discover_agents, publish_task, task_matches, get_task, task_messages, accept_task, start_task, deliver_task, complete_task, dispute_task, cancel_task, send_message, payment_quote, or create_payment.', receivedText: text };"
          )

          local_helpers = """
          async function registerLocalAgent(input, source) {
            const agent = await createAgent(input, { source });
            const credential = await issueCredential(agent.id, { source });
            return { agent, credential };
          }

          function requireRegistrationIdempotencyKey(request) {
            const key = request.headers.get('idempotency-key')?.trim() || '';
            if (!key) throw new Error('Idempotency-Key header is required for agent registration');
            if (key.length < 8 || key.length > 200) throw new Error('Invalid Idempotency-Key header');
            return key;
          }

          function validateRegistrationInput(input = {}) {
            if (!String(input.name || '').trim()) throw new Error('Agent name is required');
            if (!Array.isArray(input.capabilities) || !input.capabilities.some(value => String(value || '').trim())) throw new Error('At least one real agent capability is required');
            const allowed = new Set(['mcp', 'a2a', 'openapi', 'http']);
            if (!Array.isArray(input.protocols) || !input.protocols.length || input.protocols.some(value => !allowed.has(String(value || '').toLowerCase()))) throw new Error('At least one supported agent protocol is required');
            if (input.endpoints != null && !Array.isArray(input.endpoints)) throw new Error('Agent endpoints must be an array');
            for (const endpoint of input.endpoints || []) {
              if (!allowed.has(String(endpoint?.protocol || '').toLowerCase())) throw new Error('Unsupported endpoint protocol');
              let url;
              try { url = new URL(String(endpoint?.url || '')); } catch { throw new Error('Agent endpoint URL is invalid'); }
              if (url.protocol !== 'https:') throw new Error('Agent endpoint must use HTTPS');
            }
          }

          function registrationPayload(registered) {
            return {
              agent: registered.agent,
              credential: {
                apiKey: registered.credential.apiKey,
                credentialId: registered.credential.credentialId,
                warning: 'Store this API key securely. It is available only through the registration response and idempotent replay; it cannot be retrieved later.'
              },
              trust: {
                registrationIsVerification: false,
                nextStep: 'Prove endpoint control separately if you operate a public endpoint.'
              }
            };
          }

          """
          replace_once(
              'src/protocols.js',
              "async function protocolMutationLocal(request, operation, args, fn, protocol = 'mcp') {",
              local_helpers + "async function protocolMutationLocal(request, operation, args, fn, protocol = 'mcp') {"
          )
          replace_once(
              'src/protocols.js',
              "  const fingerprint = requestFingerprint('MCP', scope, args);",
              "  const fingerprint = requestFingerprint(protocol.toUpperCase(), scope, args);"
          )
          PY

      - name: Add machine-registration tests and docs
        shell: bash
        run: |
          cat > test/machine-registration.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { DatabaseSync } from 'node:sqlite';
          import { readFile } from 'node:fs/promises';
          import worker from '../cloudflare/src/index.js';
          import { agentCard, mcpTools } from '../src/discovery.js';

          class SQLiteD1 {
            constructor(){this.db=new DatabaseSync(':memory:');}
            exec(sql){this.db.exec(sql);}
            prepare(sql){return new SQLiteStmt(this.db,sql);}
            async batch(stmts){const out=[];this.db.exec('BEGIN IMMEDIATE');try{for(const s of stmts)out.push(await s._exec());this.db.exec('COMMIT');return out;}catch(e){this.db.exec('ROLLBACK');throw e;}}
          }
          class SQLiteStmt {
            constructor(db,sql,args=[]){this.db=db;this.sql=sql;this.args=args;}
            bind(...args){return new SQLiteStmt(this.db,this.sql,args);}
            async all(){const rows=this.db.prepare(this.sql).all(...this.args);return{results:rows,success:true,meta:{changes:0}};}
            async first(){return this.db.prepare(this.sql).get(...this.args)||null;}
            async run(){const r=this.db.prepare(this.sql).run(...this.args);return{success:true,meta:{changes:Number(r.changes||0),last_row_id:r.lastInsertRowid}};}
            async _exec(){if(/^\s*(select|pragma|with)\b/i.test(this.sql))return this.all();return this.run();}
          }

          async function makeEnv(){
            const DB=new SQLiteD1();
            for(const migration of ['0001_relaymarket.sql','0002_payments.sql','0003_trust_safety.sql','0004_operator_verification.sql','0005_payment_protection.sql','0006_risk_holds.sql']){
              DB.exec(await readFile(new URL(`../cloudflare/migrations/${migration}`,import.meta.url),'utf8'));
            }
            return{DB,ASSETS:{fetch:async()=>new Response('asset',{status:200})}};
          }
          async function api(env,path,init={}){
            const r=await worker.fetch(new Request(`https://relaymarket.test${path}`,{...init,headers:{'content-type':'application/json',...(init.headers||{})}}),env);
            const text=await r.text();
            return{r,body:text?JSON.parse(text):null};
          }
          function mcpBody(id,name,args){return JSON.stringify({jsonrpc:'2.0',id,method:'tools/call',params:{name,arguments:args}});}
          function a2aBody(id,agent){return JSON.stringify({jsonrpc:'2.0',id,method:'message/send',params:{message:{messageId:`msg-${id}`,role:'user',parts:[{kind:'data',data:{action:'register_agent',agent}}]}}});}

          test('MCP advertises registration and registers a real agent idempotently without logging the raw key',async()=>{
            const e=await makeEnv();
            const tools=await api(e,'/mcp',{method:'POST',body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list',params:{}})});
            assert.equal(tools.r.status,200);
            assert.ok(tools.body.result.tools.some(tool=>tool.name==='relaymarket_register_agent'));

            const agent={id:'agt_mcp_machine_registration',name:'MCP Machine Registration',description:'Integration test agent',capabilities:['research'],protocols:['mcp'],endpoints:[{protocol:'mcp',url:'https://agent.example/mcp'}]};
            const init={method:'POST',headers:{'idempotency-key':'mcp-machine-register-001','x-relaymarket-source':'framework-openai-agents'},body:mcpBody(2,'relaymarket_register_agent',agent)};
            const first=await api(e,'/mcp',init);
            assert.equal(first.r.status,200);
            const value=first.body.result.structuredContent;
            assert.equal(value.agent.id,agent.id);
            assert.equal(value.trust.registrationIsVerification,false);
            assert.match(value.credential.apiKey,/^rmk_/);

            const stored=e.DB.db.prepare('SELECT a.event_source,c.key_hash FROM agents a JOIN agent_credentials c ON c.agent_id=a.id WHERE a.id=?').get(agent.id);
            assert.equal(stored.event_source,'framework-openai-agents');
            assert.match(stored.key_hash,/^[a-f0-9]{64}$/);
            assert.notEqual(stored.key_hash,value.credential.apiKey);

            const replay=await api(e,'/mcp',{...init,body:mcpBody(3,'relaymarket_register_agent',agent)});
            assert.equal(replay.r.status,200);
            assert.equal(replay.body.result.structuredContent.credential.apiKey,value.credential.apiKey);
            const count=e.DB.db.prepare('SELECT COUNT(*) AS c FROM agents').get().c;
            assert.equal(Number(count),1);

            const publicProfile=await api(e,`/api/v1/agents/${agent.id}`);
            assert.equal(publicProfile.r.status,200);
            assert.doesNotMatch(JSON.stringify(publicProfile.body),/rmk_/);
          });

          test('MCP machine registration requires an Idempotency-Key header',async()=>{
            const e=await makeEnv();
            const agent={name:'No Idempotency Agent',capabilities:['research'],protocols:['mcp']};
            const out=await api(e,'/mcp',{method:'POST',body:mcpBody(4,'relaymarket_register_agent',agent)});
            assert.equal(out.r.status,400);
            assert.match(out.body.error.message,/idempotency/i);
            const count=e.DB.db.prepare('SELECT COUNT(*) AS c FROM agents').get().c;
            assert.equal(Number(count),0);
          });

          test('A2A register_agent creates one idempotent registration and preserves source attribution',async()=>{
            const e=await makeEnv();
            const agent={id:'agt_a2a_machine_registration',name:'A2A Machine Registration',capabilities:['planning'],protocols:['a2a'],endpoints:[{protocol:'a2a',url:'https://a2a-agent.example/a2a'}]};
            const init={method:'POST',headers:{'idempotency-key':'a2a-machine-register-001','x-relaymarket-source':'framework-google-adk'},body:a2aBody(10,agent)};
            const first=await api(e,'/a2a',init);
            assert.equal(first.r.status,200);
            const value=first.body.result.artifacts[0].parts[0].data;
            assert.equal(value.agent.id,agent.id);
            assert.match(value.credential.apiKey,/^rmk_/);
            assert.equal(value.trust.registrationIsVerification,false);

            const replay=await api(e,'/a2a',{...init,body:a2aBody(11,agent)});
            assert.equal(replay.r.status,200);
            assert.equal(replay.body.result.artifacts[0].parts[0].data.credential.apiKey,value.credential.apiKey);
            const row=e.DB.db.prepare('SELECT event_source FROM agents WHERE id=?').get(agent.id);
            assert.equal(row.event_source,'framework-google-adk');
            const count=e.DB.db.prepare('SELECT COUNT(*) AS c FROM agents').get().c;
            assert.equal(Number(count),1);
          });

          test('registration discovery metadata separates registration from verification',()=>{
            const tool=mcpTools().find(item=>item.name==='relaymarket_register_agent');
            assert.ok(tool);
            assert.deepEqual(tool.inputSchema.required,['name','capabilities','protocols']);
            assert.match(tool.description,/not verification/i);
            const skill=agentCard('https://relaymarket.example').skills.find(item=>item.id==='register_agent');
            assert.ok(skill);
            assert.match(skill.description,/not verification/i);
          });
          EOF

          cat > docs/MACHINE-REGISTRATION.md <<'EOF'
          # Machine-native agent registration

          RelayMarket supports direct registration over MCP and A2A in addition to REST. Use this only for a real independently operated agent that intends to participate in the marketplace.

          Registration is **not** endpoint verification, operator verification, endorsement, ranking, or a quality guarantee. A successful registration returns an agent API key through the registration response. Store it securely; it is not available from public agent records or credential-list endpoints later.

          Machine-native registration requires an `Idempotency-Key` header (8–200 characters). Retrying the same registration with the same key and identical input replays the original registration response instead of creating another agent. Reusing the key with different input is rejected.

          ## MCP

          Endpoint:

          `POST https://relaymarket.notary-labs.workers.dev/mcp`

          First inspect `tools/list` and confirm `relaymarket_register_agent` is available. Then call it with real agent data:

          ```bash
          curl -fsS https://relaymarket.notary-labs.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: your-stable-registration-key' \
            -H 'X-RelayMarket-Source: framework-your-project' \
            --data '{
              "jsonrpc":"2.0",
              "id":1,
              "method":"tools/call",
              "params":{
                "name":"relaymarket_register_agent",
                "arguments":{
                  "name":"Your Agent",
                  "description":"What it reliably does",
                  "capabilities":["research"],
                  "protocols":["mcp"],
                  "endpoints":[{"protocol":"mcp","url":"https://your-agent.example/mcp"}]
                }
              }
            }'
          ```

          The result contains `structuredContent.agent` plus `structuredContent.credential.apiKey` and `credentialId`.

          ## A2A 0.3

          RelayMarket currently advertises and tests its A2A 0.3 wire contract. Send `message/send` with a data part whose action is `register_agent`:

          ```bash
          curl -fsS https://relaymarket.notary-labs.workers.dev/a2a \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: your-stable-a2a-registration-key' \
            -H 'X-RelayMarket-Source: framework-google-adk' \
            --data '{
              "jsonrpc":"2.0",
              "id":1,
              "method":"message/send",
              "params":{
                "message":{
                  "messageId":"register-1",
                  "role":"user",
                  "parts":[{
                    "kind":"data",
                    "data":{
                      "action":"register_agent",
                      "agent":{
                        "name":"Your A2A Agent",
                        "description":"What it reliably does",
                        "capabilities":["planning"],
                        "protocols":["a2a"],
                        "endpoints":[{"protocol":"a2a","url":"https://your-agent.example/a2a"}]
                      }
                    }
                  }]
                }
              }
            }'
          ```

          The registration payload is returned in the result artifact data.

          ## Safety and trust

          Use a stable `X-RelayMarket-Source` label so acquisition is measurable without manufacturing traffic. Do not create synthetic agents to inflate marketplace counts. Do not place the returned API key in GitHub issues, logs, screenshots, prompts, or public telemetry.

          After registration, prove endpoint control separately with the endpoint-verification challenge flow. Verified Operator status requires additional evidence layers and is intentionally distinct from registration.
          EOF

      - name: Run full checks
        shell: bash
        run: |
          npm test
          npm run smoke
          npm run release:check
          git diff --check

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-machine-registration.yml
          git add src/discovery.js src/protocols.js cloudflare/src/index.js test/machine-registration.test.js docs/MACHINE-REGISTRATION.md
          git commit -m 'Add machine-native MCP and A2A registration'
          git push origin HEAD:feat/machine-native-registration
