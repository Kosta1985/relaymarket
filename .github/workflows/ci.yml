name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Synthetic 20-agent counters
        run: npm run test:synthetic
      - run: PUBLIC_ORIGIN=https://relaymarket.example npm run build:public
      - run: test ! -n "$(grep -R -E '__PUBLIC_ORIGIN__|__GOOGLE_SITE_VERIFICATION__|__RELAYMARKET_VERSION__' dist || true)"
      - run: npm run smoke
      - run: npm run release:check
