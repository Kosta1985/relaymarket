name: Cloudflare production deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/production-request.txt'

permissions:
  contents: read

concurrency:
  group: relaymarket-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare authorization
        id: auth
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured in repository secrets."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Use Node.js 22
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy and verify RelayMarket production
        if: steps.auth.outputs.ready == 'true'
        run: npm run cf:production

      - name: Deployment authorization status
        if: steps.auth.outputs.ready != 'true'
        run: |
          echo "No production mutation was attempted."
          echo "Configure the two Cloudflare repository secrets, then re-run this workflow or update deploy/production-request.txt."
