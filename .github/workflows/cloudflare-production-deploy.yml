name: TaskBay Cloudflare production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: taskbay-production-deploy
  cancel-in-progress: false

jobs:
  deploy-readiness:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CI: 'true'
      REQUIRE_CURRENT_RELEASE: '1'
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-run release gates before production deploy
        run: |
          npm test
          npm run smoke
          npm run release:check

      - name: Check Cloudflare deployment credential
        id: readiness
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credential is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::TaskBay production deployment blocked because CLOUDFLARE_API_TOKEN is unavailable in repository secrets or the production environment."
            {
              echo "## TaskBay deployment readiness"
              echo
              echo "- Tested commit: \`${DEPLOY_SHA}\`"
              echo "- Release gates: passed"
              echo "- GitHub environment: production"
              echo "- Cloudflare deployment executed: no"
              echo "- Reason: CLOUDFLARE_API_TOKEN unavailable"
              echo "- Production state must continue to be verified independently"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resolve Cloudflare account ID when omitted
        if: steps.readiness.outputs.ready == 'true' && env.CLOUDFLARE_ACCOUNT_ID == ''
        shell: bash
        run: |
          set -euo pipefail
          accounts_json="$RUNNER_TEMP/cloudflare-accounts.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/accounts > "$accounts_json"
          success="$(jq -r '.success // false' "$accounts_json")"
          if [[ "$success" != "true" ]]; then
            echo "::error::Cloudflare API token could not list accessible accounts. Add CLOUDFLARE_ACCOUNT_ID explicitly or use a token with Account Settings Read plus Workers/D1 deployment permissions."
            exit 1
          fi
          count="$(jq '.result | length' "$accounts_json")"
          if [[ "$count" != "1" ]]; then
            echo "::error::Cloudflare token can access $count accounts; configure CLOUDFLARE_ACCOUNT_ID explicitly so deployment cannot target the wrong account."
            exit 1
          fi
          account_id="$(jq -r '.result[0].id' "$accounts_json")"
          if [[ -z "$account_id" || "$account_id" == "null" ]]; then
            echo "::error::Cloudflare account ID could not be resolved."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Resolved the single Cloudflare account available to the deployment token."

      - name: Validate Cloudflare credentials
        if: steps.readiness.outputs.ready == 'true'
        run: npx wrangler@4.127.1 whoami

      - name: Deploy and verify TaskBay production
        if: steps.readiness.outputs.ready == 'true'
        run: npm run cf:production

      - name: Verify complete TaskBay launch surface
        if: steps.readiness.outputs.ready == 'true'
        run: TARGET_ORIGIN=https://relaymarket.notary-labs.workers.dev node scripts/launch-blackbox.mjs

      - name: Record verified deployment evidence
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo "## TaskBay production deployment"
            echo
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- Current technical origin: https://relaymarket.notary-labs.workers.dev"
            echo "- Product brand: TaskBay"
            echo "- GitHub environment: production"
            echo "- Cloudflare deployment executed: yes"
            echo "- Release gates: passed"
            echo "- Core post-deploy verification: passed"
            echo "- Full TaskBay launch black-box: passed"
            echo "- Production payment capture: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
