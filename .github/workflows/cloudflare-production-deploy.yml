name: Cloudflare production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'deploy/production-request.txt'

permissions:
  contents: read

concurrency:
  group: relaymarket-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare authorization
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Production deploy blocked: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment or repository secrets."
            exit 1
          fi

      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        run: npx wrangler@4.127.1 whoami

      - name: Deploy and verify RelayMarket production
        run: npm run cf:production

      - name: Record deployment evidence
        shell: bash
        run: |
          {
            echo "## RelayMarket production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Origin: https://relaymarket.notary-labs.workers.dev"
            echo "- Result: deployment and post-deployment verification passed"
          } >> "$GITHUB_STEP_SUMMARY"
