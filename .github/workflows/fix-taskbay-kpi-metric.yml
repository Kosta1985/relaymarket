name: Fix TaskBay KPI match metric

on:
  push:
    branches:
      - taskbay-launch-kpis
    paths:
      - .github/workflows/fix-taskbay-kpi-metric.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: taskbay-launch-kpis
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align KPI metric with actual ranking event
        shell: python
        run: |
          from pathlib import Path
          for name in ['cloudflare/src/repository.js','src/store.js']:
              path=Path(name)
              text=path.read_text()
              count=text.count("'match.requested'")
              if count != 2:
                  raise SystemExit(f'{name}: expected 2 match.requested references, found {count}')
              path.write_text(text.replace("'match.requested'","'task.match_requested'"))
      - name: Test
        run: npm test
      - name: Smoke
        run: npm run smoke
      - name: Release check
        run: npm run release:check
      - name: Commit validated metric fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "taskbay-launch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/src/repository.js src/store.js
          git commit -m "Align TaskBay launch KPIs with match request events"
          git push origin HEAD:taskbay-launch-kpis
