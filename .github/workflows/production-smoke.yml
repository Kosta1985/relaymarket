name: TaskBay production discovery smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live compatibility host
        run: TARGET_ORIGIN=https://relaymarket.notary-labs.workers.dev npm run production:verify
      - name: Report live TaskBay brand migration state
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://relaymarket.notary-labs.workers.dev/';
          const response = await fetch(url, { headers: { 'user-agent': 'TaskBay-Production-Smoke' } });
          if (response.status !== 200) throw new Error(`${url} unexpected status ${response.status}`);
          const html = await response.text();
          const hasTaskBayTitle = /<title>TaskBay\b/i.test(html);
          const hasTaskBayHeader = /class="brand-word">TaskBay</i.test(html);
          const hasLegacyHeader = /class="brand-word">\s*RelayMarket/i.test(html);
          if (hasTaskBayTitle && hasTaskBayHeader && !hasLegacyHeader) {
            console.log('Live homepage public brand is TaskBay.');
          } else {
            console.log('::warning::Live compatibility host is healthy but is still serving a pre-TaskBay homepage build. Source is ready; production brand migration remains pending until the Cloudflare deployment credential is available.');
          }
          NODE
      - name: Probe optional well-known MCP discovery
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://relaymarket.notary-labs.workers.dev/.well-known/mcp.json';
          const response = await fetch(url, { headers: { 'user-agent': 'TaskBay-Production-Smoke' } });
          if (response.status === 404) {
            console.log('TaskBay well-known MCP discovery is not deployed yet (HTTP 404); strict current-release verification remains enforced by the Cloudflare deployment workflow.');
            process.exit(0);
          }
          if (response.status !== 200) throw new Error(`${url} unexpected status ${response.status}`);
          const body = await response.json();
          if (!['TaskBay', 'RelayMarket'].includes(body.name)) throw new Error('well-known MCP name mismatch');
          if (body.endpoint !== 'https://relaymarket.notary-labs.workers.dev/mcp') throw new Error('well-known MCP endpoint mismatch');
          if (body.officialRegistryName !== 'io.github.Kosta1985/relaymarket') throw new Error('well-known MCP registry identity mismatch');
          console.log(`TaskBay well-known MCP discovery is live and valid under compatibility identity (${body.name}).`);
          NODE
