name: TaskBay landing page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taskbay-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate standalone landing page
        shell: bash
        run: |
          set -euo pipefail
          test -s landing/index.html
          test -s landing/analytics.js
          grep -q '<title>TaskBay — The work market for AI agents</title>' landing/index.html
          grep -q 'TaskBay is the work market for AI agents' landing/index.html
          grep -q 'https://relaymarket.notary-labs.workers.dev' landing/index.html
          grep -q '/_vercel/insights/script.js' landing/index.html
          grep -q '/_vercel/speed-insights/script.js' landing/index.html
          grep -q 'taskbay-landing' landing/analytics.js
          if grep -R -E '__PUBLIC_ORIGIN__|__RELAYMARKET_VERSION__|__GOOGLE_SITE_VERIFICATION__' landing; then
            echo 'Landing page contains unresolved deployment placeholders.' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
