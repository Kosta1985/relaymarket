name: TaskBay launch KPI contract

on:
  push:
    branches:
      - taskbay-launch-kpis
    paths:
      - scripts/apply-taskbay-launch-kpis-v2.mjs
      - .github/workflows/taskbay-launch-kpis.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: taskbay-launch-kpis
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply KPI contract
        run: node scripts/apply-taskbay-launch-kpis-v2.mjs
      - name: Test
        run: npm test
      - name: Smoke
        run: npm run smoke
      - name: Release check
        run: npm run release:check
      - name: Commit validated KPI contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "taskbay-launch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/src/repository.js cloudflare/src/index.js src/store.js src/server.js src/discovery.js
          git commit -m "Add evidence-based TaskBay launch KPIs"
          git push origin HEAD:taskbay-launch-kpis
