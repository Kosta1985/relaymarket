name: TaskBay launch-loop codemod

on:
  push:
    branches:
      - taskbay-launch-loop
    paths:
      - scripts/apply-taskbay-launch-loop.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout launch branch
        uses: actions/checkout@v4
        with:
          ref: taskbay-launch-loop
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded codemod
        run: node scripts/apply-taskbay-launch-loop.mjs

      - name: Run product tests
        run: npm test

      - name: Run smoke
        run: npm run smoke

      - name: Run release checks
        run: npm run release:check

      - name: Commit generated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "taskbay-launch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/src/repository.js cloudflare/src/index.js src/store.js src/server.js public/index.html public/app.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Implement TaskBay requester-provider launch loop"
          git push origin HEAD:taskbay-launch-loop
