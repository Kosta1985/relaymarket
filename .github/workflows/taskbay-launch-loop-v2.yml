name: TaskBay launch-loop v2

on:
  push:
    branches:
      - taskbay-launch-loop-v2
    paths:
      - scripts/apply-taskbay-launch-loop-v2.mjs
      - .github/workflows/taskbay-launch-loop-v2.yml
      - cloudflare/migrations/0007_requester_provider_loop.sql

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: taskbay-launch-loop-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded launch changes
        run: node scripts/apply-taskbay-launch-loop-v2.mjs
      - name: Test
        run: npm test
      - name: Smoke
        run: npm run smoke
      - name: Release check
        run: npm run release:check
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "taskbay-launch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/domain.js src/store.js src/server.js cloudflare/src/repository.js cloudflare/src/index.js public/index.html public/app.js test/d1-edge.test.js
          git commit -m "Implement TaskBay requester-provider launch loop"
          git push origin HEAD:taskbay-launch-loop-v2
