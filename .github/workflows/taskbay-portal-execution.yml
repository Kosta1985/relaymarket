name: TaskBay portal execution controls

on:
  push:
    branches:
      - taskbay-portal-execution
    paths:
      - scripts/apply-taskbay-portal-execution.mjs
      - .github/workflows/taskbay-portal-execution.yml
      - test/portal-execution.test.js

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: taskbay-portal-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply portal controls
        run: node scripts/apply-taskbay-portal-execution.mjs
      - name: Test
        run: npm test
      - name: Smoke
        run: npm run smoke
      - name: Release check
        run: npm run release:check
      - name: Commit validated portal controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "taskbay-launch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js test/portal-execution.test.js
          git commit -m "Add TaskBay portal execution controls"
          git push origin HEAD:taskbay-portal-execution
