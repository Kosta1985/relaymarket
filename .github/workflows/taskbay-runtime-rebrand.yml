name: TaskBay runtime rebrand migration

on:
  push:
    paths:
      - '.github/workflows/taskbay-runtime-rebrand.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Migrate runtime brand with compatibility aliases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def required(text, old, new, label, minimum=1):
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{label}: expected at least {minimum} occurrence(s), found {count}')
              return text.replace(old, new)

          # Public machine discovery: TaskBay is the advertised protocol/tool brand.
          p = 'src/discovery.js'
          t = read(p)
          t = required(t, "name: 'X-RelayMarket-Source'", "name: 'X-TaskBay-Source'", p + ' source header')
          t = t.replace('Legacy compatibility source-attribution header.', 'TaskBay source-attribution header.')
          t, count = re.subn(r"name: 'relaymarket_([a-z0-9_]+)'", lambda m: "name: 'taskbay_" + m.group(1) + "'", t)
          if count < 10:
              raise SystemExit(f'{p}: expected MCP tool declarations to migrate, changed {count}')
          write(p, t)

          # Cloudflare runtime: new brand/output names, new source header, legacy aliases accepted.
          p = 'cloudflare/src/index.js'
          t = read(p)
          t = required(t,
              "const ALLOW_HEADERS = 'content-type,idempotency-key,x-relaymarket-source,authorization,mcp-protocol-version,mcp-method,mcp-name,accept';",
              "const ALLOW_HEADERS = 'content-type,idempotency-key,x-taskbay-source,x-relaymarket-source,authorization,mcp-protocol-version,mcp-method,mcp-name,accept';",
              p + ' allow headers')
          t = required(t, "service: 'relaymarket'", "service: 'taskbay'", p + ' health service')
          t = required(t,
              "return String(request.headers.get('x-relaymarket-source') || url.searchParams.get('source') || 'direct')",
              "return String(request.headers.get('x-taskbay-source') || request.headers.get('x-relaymarket-source') || url.searchParams.get('source') || 'direct')",
              p + ' request source')
          t = t.replace('Use RelayMarket tools to discover agents, publish tasks, rank matches, inspect tasks, read task messages, and query marketplace statistics.', 'Use TaskBay tools to discover agents, publish tasks, rank matches, inspect tasks, read task messages, and query marketplace statistics.')
          t = t.replace("name: 'relaymarket', version: VERSION", "name: 'taskbay', version: VERSION")
          t = t.replace('RelayMarket is an agent-to-agent marketplace. Prefer the discovery and task tools over scraping the human portal.', 'TaskBay is an agent-to-agent marketplace. Prefer the discovery and task tools over scraping the human portal.')
          t, count = re.subn(r"name === 'relaymarket_([a-z0-9_]+)'", lambda m: "['taskbay_" + m.group(1) + "','relaymarket_" + m.group(1) + "'].includes(name)", t)
          if count < 10:
              raise SystemExit(f'{p}: expected MCP legacy aliases, changed {count}')
          t = t.replace('object.metadata?.relaymarket_payment_id', '(object.metadata?.taskbay_payment_id || object.metadata?.relaymarket_payment_id)')
          t = t.replace('`relaymarket-protection-', '`taskbay-protection-')
          write(p, t)

          # Local protocol runtime mirrors Cloudflare behavior.
          p = 'src/protocols.js'
          t = read(p)
          t = t.replace('Use RelayMarket tools to discover agents, publish tasks, rank matches, inspect tasks, read task messages, and query marketplace statistics.', 'Use TaskBay tools to discover agents, publish tasks, rank matches, inspect tasks, read task messages, and query marketplace statistics.')
          t = t.replace("name: 'relaymarket', version: VERSION", "name: 'taskbay', version: VERSION")
          t = t.replace('RelayMarket is an agent-to-agent marketplace. Prefer the discovery and task tools over scraping the human portal.', 'TaskBay is an agent-to-agent marketplace. Prefer the discovery and task tools over scraping the human portal.')
          t = t.replace("name: 'RelayMarketResult'", "name: 'TaskBayResult'")
          t = t.replace("metadata: { service: 'RelayMarket'", "metadata: { service: 'TaskBay'")
          t, count = re.subn(r"name === 'relaymarket_([a-z0-9_]+)'", lambda m: "['taskbay_" + m.group(1) + "','relaymarket_" + m.group(1) + "'].includes(name)", t)
          if count < 10:
              raise SystemExit(f'{p}: expected local MCP legacy aliases, changed {count}')
          write(p, t)

          # Browser portal uses TaskBay storage/header names; old session storage remains readable during migration.
          p = 'public/app.js'
          t = read(p)
          t = required(t, "const SESSION_KEYS = 'relaymarket.sessionCredentials';", "const SESSION_KEYS = 'taskbay.sessionCredentials';\nconst LEGACY_SESSION_KEYS = 'relaymarket.sessionCredentials';", p + ' session key')
          t = t.replace("headers.set('x-relaymarket-source', 'web-portal');", "headers.set('x-taskbay-source', 'web-portal');")
          t = t.replace('https://github.com/Kosta1985/relaymarket/blob/main/docs/REGISTER-NOW.md', '/join.html')
          old = "function sessionCredentials() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEYS) || '{}'); } catch { return {}; } }"
          new = "function sessionCredentials() { try { const current=sessionStorage.getItem(SESSION_KEYS); if(current)return JSON.parse(current); const legacy=sessionStorage.getItem(LEGACY_SESSION_KEYS); if(!legacy)return {}; sessionStorage.setItem(SESSION_KEYS,legacy); return JSON.parse(legacy); } catch { return {}; } }"
          t = required(t, old, new, p + ' session migration')
          write(p, t)

          p = 'public/analytics-bridge.js'
          t = read(p)
          t = t.replace("headers.set('x-relaymarket-source', marketSource);", "headers.set('x-taskbay-source', marketSource);")
          t = t.replace("const headers = { 'x-relaymarket-source': marketSource };", "const headers = { 'x-taskbay-source': marketSource };")
          write(p, t)

          # Local HTTP runtime and security configuration get TaskBay-first names with legacy env fallbacks.
          p = 'src/server.js'
          t = read(p)
          t = t.replace("service:'relaymarket'", "service:'taskbay'")
          t = t.replace("process.env.RELAYMARKET_PAYMENT_PROVIDER||'mock'", "process.env.TASKBAY_PAYMENT_PROVIDER||process.env.RELAYMARKET_PAYMENT_PROVIDER||'mock'")
          t = t.replace('console.log(`RelayMarket ${VERSION} listening on http://localhost:${port}`)', 'console.log(`TaskBay ${VERSION} listening on http://localhost:${port}`)')
          write(p, t)

          p = 'src/security.js'
          t = read(p)
          t = required(t, "const DEFAULT_LIMIT=Number(process.env.RELAYMARKET_RATE_LIMIT||120);", "const DEFAULT_LIMIT=Number(process.env.TASKBAY_RATE_LIMIT||process.env.RELAYMARKET_RATE_LIMIT||120);", p + ' rate limit env')
          t = required(t, "const raw=req.headers['x-relaymarket-source']||url.searchParams.get('source')||'direct';", "const raw=req.headers['x-taskbay-source']||req.headers['x-relaymarket-source']||url.searchParams.get('source')||'direct';", p + ' source header')
          t = t.replace('`RelayMarket-Ownership-Verifier/${VERSION}`', '`TaskBay-Ownership-Verifier/${VERSION}`')
          write(p, t)

          # New credentials/challenges are TaskBay-prefixed; old credentials still authenticate.
          p = 'src/store.js'
          t = read(p)
          t = required(t, "const DATA_FILE=process.env.RELAYMARKET_DATA_FILE||new URL('../data/market.json',import.meta.url);", "const DATA_FILE=process.env.TASKBAY_DATA_FILE||process.env.RELAYMARKET_DATA_FILE||new URL('../data/market.json',import.meta.url);", p + ' data env')
          t = t.replace('apiKey=`rmk_${keyId}_${secret}`', 'apiKey=`tbk_${keyId}_${secret}`')
          t = required(t, "if(!apiKey||!String(apiKey).startsWith('rmk_'))return null;", "if(!apiKey||!/^((tbk)|(rmk))_/.test(String(apiKey)))return null;", p + ' credential compatibility')
          t = t.replace('const token=`rm_verify_${crypto.randomBytes(24).toString(\'base64url\')}`', 'const token=`tb_verify_${crypto.randomBytes(24).toString(\'base64url\')}`')
          t = t.replace('/.well-known/relaymarket-verification.txt', '/.well-known/taskbay-verification.txt')
          write(p, t)

          p = 'cloudflare/src/repository.js'
          t = read(p)
          t = t.replace('apiKey=`rmk_${keyId}_${randomB64(24)}`', 'apiKey=`tbk_${keyId}_${randomB64(24)}`')
          t = required(t, "if(!apiKey||!String(apiKey).startsWith('rmk_'))return null;", "if(!apiKey||!/^((tbk)|(rmk))_/.test(String(apiKey)))return null;", p + ' credential compatibility')
          t = t.replace('token=`rm_verify_${randomB64(24)}`', 'token=`tb_verify_${randomB64(24)}`')
          t = t.replace('/.well-known/relaymarket-verification.txt', '/.well-known/taskbay-verification.txt')
          write(p, t)

          # Stripe dashboard metadata is TaskBay-branded; webhook reader accepts old metadata too.
          p = 'cloudflare/src/stripe.js'
          t = read(p)
          t = t.replace('`relaymarket_${payment.taskId}`', '`taskbay_${payment.taskId}`')
          t = t.replace('metadata[relaymarket_payment_id]', 'metadata[taskbay_payment_id]')
          t = t.replace('metadata[relaymarket_task_id]', 'metadata[taskbay_task_id]')
          t = t.replace('metadata[relaymarket_platform_fee_bps]', 'metadata[taskbay_platform_fee_bps]')
          write(p, t)

          # CI's synthetic canonical host follows the current brand.
          p = '.github/workflows/ci.yml'
          t = read(p).replace('PUBLIC_ORIGIN=https://relaymarket.example', 'PUBLIC_ORIGIN=https://taskbay.example')
          write(p, t)
          PY
          git diff --check
          git diff --stat
          git diff -- src/discovery.js cloudflare/src/index.js src/protocols.js public/app.js public/analytics-bridge.js src/server.js src/security.js src/store.js cloudflare/src/repository.js cloudflare/src/stripe.js .github/workflows/ci.yml
      - name: Commit TaskBay runtime migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No runtime migration required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/discovery.js cloudflare/src/index.js src/protocols.js public/app.js public/analytics-bridge.js src/server.js src/security.js src/store.js cloudflare/src/repository.js cloudflare/src/stripe.js .github/workflows/ci.yml
          git commit -m 'Migrate TaskBay runtime branding and compatibility aliases'
          git push origin HEAD:main
