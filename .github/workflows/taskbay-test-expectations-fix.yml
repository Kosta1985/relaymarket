name: TaskBay test expectation migration

on:
  push:
    paths:
      - '.github/workflows/taskbay-test-expectations-fix.yml'

permissions:
  contents: write

jobs:
  fix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align tests with TaskBay runtime while preserving legacy compatibility coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new, expected))

          replace_exact('test/analytics-attribution.test.js', '/x-relaymarket-source/', '/x-taskbay-source/')

          replace_exact('test/d1-edge.test.js', "assert.match(first.body.credential.apiKey,/^rmk_/);", "assert.match(first.body.credential.apiKey,/^tbk_/);")
          replace_exact('test/d1-edge.test.js', "assert.equal(init.r.status,200);assert.equal(init.body.result.serverInfo.name,'relaymarket');", "assert.equal(init.r.status,200);assert.equal(init.body.result.serverInfo.name,'taskbay');")
          replace_exact('test/d1-edge.test.js', "x.name==='relaymarket_publish_task'", "x.name==='taskbay_publish_task'")
          replace_exact('test/d1-edge.test.js', "assert.match(c.body.challenge.token,/^rm_verify_/);", "assert.match(c.body.challenge.token,/^tb_verify_/);")
          replace_exact('test/d1-edge.test.js', "https://agent.example/.well-known/relaymarket-verification.txt", "https://agent.example/.well-known/taskbay-verification.txt")
          replace_exact('test/d1-edge.test.js', "body.get('metadata[relaymarket_platform_fee_bps]')", "body.get('metadata[taskbay_platform_fee_bps]')")

          replace_exact('test/discovery.test.js', "x.name==='relaymarket_trust_summary'", "x.name==='taskbay_trust_summary'")

          replace_exact('test/portal.test.js', '/x-relaymarket-source/', '/x-taskbay-source/')
          replace_exact('test/portal.test.js', '/REGISTER-NOW\\.md/', '/join\\.html/')

          p = Path('test/stripe.test.js')
          t = p.read_text()
          replacements = [
              ('Stripe adapter creates payment intent for payer total and preserves RelayMarket metadata', 'Stripe adapter creates payment intent for payer total and preserves TaskBay metadata'),
              ("'relaymarket_tsk_1'", "'taskbay_tsk_1'"),
              ("metadata[relaymarket_payment_id]", "metadata[taskbay_payment_id]"),
              ("metadata[relaymarket_task_id]", "metadata[taskbay_task_id]"),
              ("metadata[relaymarket_platform_fee_bps]", "metadata[taskbay_platform_fee_bps]")
          ]
          for old, new in replacements:
              if old not in t:
                  raise SystemExit(f'test/stripe.test.js: missing expected {old!r}')
              t = t.replace(old, new)
          p.write_text(t)

          for candidate in ['test/payment.test.js', 'test/payments.test.js', 'test/domain.test.js']:
              p = Path(candidate)
              if p.exists():
                  t = p.read_text()
                  t = t.replace('RelayMarket platform fee is exactly 1 percent in basis points', 'TaskBay platform fee is exactly 1 percent in basis points')
                  p.write_text(t)
          PY
          git diff --check
          git diff --stat
      - name: Run complete test suite before commit
        run: npm test
      - name: Commit aligned TaskBay tests
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No test migration required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          git commit -m 'Align tests with TaskBay runtime rebrand'
          git push origin HEAD:main
