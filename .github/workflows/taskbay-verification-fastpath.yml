name: TaskBay verification fast-path migration

on:
  push:
    paths:
      - '.github/workflows/taskbay-verification-fastpath.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verification fast path
        run: node scripts/one-shot-verification-fastpath.mjs
      - name: Run tests
        run: npm test
      - name: Commit fast path
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/index.js src/server.js src/discovery.js scripts/connect-agent.mjs test/verification-fastpath.test.js
          git commit -m 'Return endpoint verification challenge during TaskBay registration'
          git push origin HEAD:main
