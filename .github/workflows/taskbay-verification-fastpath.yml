name: TaskBay verification fast-path migration

on:
  push:
    paths:
      - '.github/workflows/taskbay-verification-fastpath.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add safe registration verification fast path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Cloudflare production runtime.
          path = Path('cloudflare/src/index.js')
          text = path.read_text()
          old = """          const registered = await repo.registerAgent(body, { source });
          return {
            status: 201,
            payload: {
              agent: registered.agent,
              credential: {
                apiKey: registered.credential.apiKey,
                credentialId: registered.credential.credentialId,
                warning: 'Store this API key securely; it is returned only through this registration response.'
              }
            }
          };"""
          new = """          const registered = await repo.registerAgent(body, { source });
          let verification = registered.agent?.endpoints?.length
            ? { status: 'manual_challenge_required', challenge: null, challengeEndpoint: `/api/v1/agents/${encodeURIComponent(registered.agent.id)}/verification-challenges` }
            : { status: 'endpoint_required', challenge: null };
          if (registered.agent?.endpoints?.length) {
            try {
              const challenge = await repo.createVerificationChallenge(registered.agent.id, 0, { source });
              verification = { status: 'challenge_created', challenge, nextAction: 'publish_token_then_verify' };
            } catch (error) {
              verification = {
                status: 'manual_challenge_required',
                challenge: null,
                error: error?.code || 'verification_challenge_creation_failed',
                challengeEndpoint: `/api/v1/agents/${encodeURIComponent(registered.agent.id)}/verification-challenges`
              };
            }
          }
          return {
            status: 201,
            payload: {
              agent: registered.agent,
              credential: {
                apiKey: registered.credential.apiKey,
                credentialId: registered.credential.credentialId,
                warning: 'Store this API key securely; it is returned only through this registration response.'
              },
              verification
            }
          };"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'cloudflare registration block: expected 1, found {count}')
          path.write_text(text.replace(old, new, 1))

          # Local runtime mirrors the production response contract.
          path = Path('src/server.js')
          text = path.read_text()
          old = "if(req.method==='POST'&&url.pathname==='/api/v1/agents')return await mutation(req,res,url,source,async b=>{const agent=await createAgent(b,{source}),credential=await issueCredential(agent.id,{source});return{status:201,payload:{agent,credential:{apiKey:credential.apiKey,credentialId:credential.credentialId,warning:'Store this API key securely; it is returned only through this registration response.'}}}});"
          new = "if(req.method==='POST'&&url.pathname==='/api/v1/agents')return await mutation(req,res,url,source,async b=>{const agent=await createAgent(b,{source}),credential=await issueCredential(agent.id,{source});let verification=agent.endpoints?.length?{status:'manual_challenge_required',challenge:null,challengeEndpoint:`/api/v1/agents/${encodeURIComponent(agent.id)}/verification-challenges`}:{status:'endpoint_required',challenge:null};if(agent.endpoints?.length){try{verification={status:'challenge_created',challenge:await createVerificationChallenge(agent.id,0,source),nextAction:'publish_token_then_verify'}}catch(error){verification={status:'manual_challenge_required',challenge:null,error:error?.code||'verification_challenge_creation_failed',challengeEndpoint:`/api/v1/agents/${encodeURIComponent(agent.id)}/verification-challenges`}}}return{status:201,payload:{agent,credential:{apiKey:credential.apiKey,credentialId:credential.credentialId,warning:'Store this API key securely; it is returned only through this registration response.'},verification}}});"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'local registration block: expected 1, found {count}')
          path.write_text(text.replace(old, new, 1))

          # OpenAPI advertises the new response without removing the old challenge endpoint.
          path = Path('src/discovery.js')
          text = path.read_text()
          old = "'201': { description: 'Agent registered; API key is returned exactly once in this response' }"
          new = "'201': { description: 'Agent registered; API key is returned exactly once. When a public endpoint is supplied, TaskBay also attempts to return an endpoint verification challenge in the same response.' }"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'OpenAPI registration response: expected 1, found {count}')
          path.write_text(text.replace(old, new, 1))

          # CLI consumes the same-response challenge first, then falls back for older deployed runtimes.
          path = Path('scripts/connect-agent.mjs')
          text = path.read_text()
          pattern = re.compile(r"const challengeResponse = await fetch\(`\$\{origin\}/api/v1/agents/\$\{encodeURIComponent\(agentId\)\}/verification-challenges`, \{.*?const challenge = challengePayload\?\.challenge \|\| \{\};\n", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('connect-agent challenge block not found')
          replacement = """let challenge = registerPayload?.verification?.challenge || null;
if (!challenge?.id || !challenge?.token || !challenge?.verificationUrl) {
  const challengeResponse = await fetch(`${origin}/api/v1/agents/${encodeURIComponent(agentId)}/verification-challenges`, {
    method: 'POST',
    headers: {
      authorization: `Bearer ${apiKey}`,
      'content-type': 'application/json',
      'idempotency-key': crypto.randomUUID(),
      'x-taskbay-source': source
    },
    body: JSON.stringify({ endpointIndex: 0 })
  });
  const challengePayload = await readJson(challengeResponse);
  if (!challengeResponse.ok) {
    console.log('TaskBay registration succeeded, but automatic verification challenge creation failed.');
    console.log(`Agent ID: ${agentId}`);
    console.log('API KEY — STORE THIS SECURELY. IT IS RETURNED ONLY ONCE:');
    console.log(apiKey);
    failResponse('Challenge creation failed', challengeResponse, challengePayload);
  }
  challenge = challengePayload?.challenge || null;
}
"""
          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text)

          # Static regression test protects the fast path and fallback behavior.
          test = Path('test/verification-fastpath.test.js')
          test.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';

const edge = await readFile(new URL('../cloudflare/src/index.js', import.meta.url), 'utf8');
const local = await readFile(new URL('../src/server.js', import.meta.url), 'utf8');
const connect = await readFile(new URL('../scripts/connect-agent.mjs', import.meta.url), 'utf8');
const discovery = await readFile(new URL('../src/discovery.js', import.meta.url), 'utf8');

test('registration attempts endpoint verification challenge without hiding the one-time credential', () => {
  assert.match(edge, /verification = \{ status: 'challenge_created', challenge/);
  assert.match(edge, /manual_challenge_required/);
  assert.match(edge, /apiKey: registered\.credential\.apiKey/);
  assert.match(local, /status:'challenge_created'/);
  assert.match(local, /manual_challenge_required/);
});

test('connect helper consumes same-response challenge and keeps old-runtime fallback', () => {
  assert.match(connect, /registerPayload\?\.verification\?\.challenge/);
  assert.match(connect, /verification-challenges/);
  assert.match(connect, /x-taskbay-source/);
});

test('OpenAPI documents same-response verification challenge', () => {
  assert.match(discovery, /also attempts to return an endpoint verification challenge in the same response/);
});
""")
          PY
          git diff --check
          npm test
      - name: Commit fast path
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/index.js src/server.js src/discovery.js scripts/connect-agent.mjs test/verification-fastpath.test.js
          git commit -m 'Return endpoint verification challenge during TaskBay registration'
          git push origin HEAD:main
